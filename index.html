<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harmonysplorer</title>
<script>
/* Harmonysplorer engine — pure-JS port of main.py
 *
 * Conventions (jazz):
 *   "7"     → minor 7th added to triad (dominant on major, m7 on minor, etc.)
 *   "maj7"  → major 7th
 *   "o" / "dim" → diminished triad/7th
 *   "h"     → half-diminished
 *   "+" / "aug" → augmented
 *   Colon notation: "I:2" = I chord with default inversion 2 (5th in bass)
 *   Slash: "V7/ii" = V7 of ii (secondary dominant)
 *
 * Exposes window.Engine = { getChords, parseChord, voiceLead, exportMidi }.
 */
(function (global) {
  'use strict';

  // ───────────────────────────────────────────────
  // Constants
  // ───────────────────────────────────────────────

  const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  const KEY_SIGS = {
    'C':0,'G':1,'D':2,'A':3,'E':4,'B':5,'F#':6,'C#':7,
    'F':-1,'Bb':-2,'Eb':-3,'Ab':-4,'Db':-5,'Gb':-6,'Cb':-7,
  };

  const NOTE_TO_PC = {
    'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'E#':5,'Fb':4,
    'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,
    'B':11,'B#':0,'Cb':11,
  };

  const DEGREE_SEMITONES = {'I':0,'II':2,'III':4,'IV':5,'V':7,'VI':9,'VII':11};

  const INTERVALS = {
    'maj':     [0,4,7],
    'min':     [0,3,7],
    'dim':     [0,3,6],
    'aug':     [0,4,8],
    'dom7':    [0,4,7,10],
    'maj7':    [0,4,7,11],
    'm7':      [0,3,7,10],
    'mmaj7':   [0,3,7,11],
    'halfdim': [0,3,6,10],
    'dim7':    [0,3,6,9],
    'aug7':    [0,4,8,10],
    'dom9':    [0,4,10,14],
    'maj9':    [0,4,11,14],
    'm9':      [0,3,10,14],
    'sus4':    [0,5,7],
    'sus2':    [0,2,7],
    'sus47':   [0,5,7,10],
  };

  const QUALITY_NAMES = {
    'maj':'major triad','min':'minor triad','dim':'diminished triad','aug':'augmented triad',
    'dom7':'dominant 7th','maj7':'major 7th','m7':'minor 7th',
    'mmaj7':'minor-major 7th','halfdim':'half-diminished 7th','dim7':'diminished 7th',
    'aug7':'augmented 7th','dom9':'dominant 9th','maj9':'major 9th','m9':'minor 9th',
    'sus4':'suspended 4th','sus2':'suspended 2nd','sus47':'sus4 dom7',
  };

  // Roman numeral regex — groups: accidental | degree | triad-mod | extension | figured-bass | secondary
  const RN_RE = new RegExp(
    '^(bb|b|##|#)?' +
    '(VII|VI|IV|III|II|I|vii|vi|iv|iii|ii|i|V|v)' +
    '(\\+|aug|h|o)?' +
    '(maj7|maj9|mMaj7|m7b5|m7|sus4(?:7)?|sus2|add9|9|7)?' +
    '(64|65|43|42|6)?' +
    '(?:/(.+))?$'
  );

  const FUNCTION_MAP = {
    "major": {
      "tonic":       ["I","Imaj7","I:1","iii","iii7","vi","vi7"],
      "predominant": ["ii","ii7","ii:1","IV","IVmaj7","IV:1"],
      "dominant":    ["I:2","V","V7","V7:1","V7:3","V9","viio","viih7","V/V","V7/V"],
      "borrowed":    ["bVI","bVImaj7","bVI7","bVII","bVII7","bIII","bIII7","iv","iv7","bII","bII:1"],
      "secondary":   ["V/ii","V/iii","V/IV","V/vi","V7/ii","V7/IV","V7/vi","V7/bII"],
    },
    "minor": {
      "tonic":       ["i","i:1","III","IIImaj7","VI","VImaj7","I"],
      "predominant": ["iio","iih7","iio:1","iv","iv7","iv:1","II","IVmaj7"],
      "dominant":    ["V","V7","V7:1","V7:3","V9","viio","viio7","viih7","VII","VII7"],
      "borrowed":    ["IV","IVmaj7","bII","bII:1"],
      "secondary":   ["V/III","V/VI","V7/III","V7/VI","V/iv","V7/iv"],
    },
  };

  const FUNCTIONAL_ROLE = {
    "I:2":"dominant",
    "bVI":"predominant","bVImaj7":"predominant","bVI7":"predominant",
    "bVII":"predominant","bVII7":"predominant",
    "bIII":"tonic","bIIImaj7":"tonic","bIII7":"tonic",
    "iv":"predominant","iv7":"predominant","iv:1":"predominant",
    "bII":"predominant","bII:1":"predominant",
    "II":"predominant","IV":"predominant","IVmaj7":"predominant",
    "I":"tonic",
    "V/ii":"predominant","V7/ii":"predominant",
    "V/iii":"tonic",
    "V/IV":"predominant","V7/IV":"predominant",
    "V/V":"dominant","V7/V":"dominant",
    "V/vi":"tonic","V7/vi":"tonic",
    "V/III":"tonic","V7/III":"tonic",
    "V/VI":"predominant","V7/VI":"predominant",
    "V/iv":"predominant","V7/iv":"predominant",
    "V7/bII":"predominant",
    "VII":"dominant","VII7":"dominant","viio7":"dominant",
  };

  // ───────────────────────────────────────────────
  // Helpers
  // ───────────────────────────────────────────────

  function keyRootPc(keyStr) {
    const n = keyStr[0];
    const acc = keyStr.slice(1);
    const base = (n in NOTE_TO_PC) ? NOTE_TO_PC[n] : 0;
    const d = {'#':1,'##':2,'b':-1,'bb':-2}[acc] || 0;
    return ((base + d) % 12 + 12) % 12;
  }

  function sharpsOf(keyStr) {
    return (keyStr in KEY_SIGS) ? KEY_SIGS[keyStr] : 0;
  }

  function spell(midi, sharps) {
    const pc = ((midi % 12) + 12) % 12;
    const octave = Math.floor(midi / 12) - 1;
    const names = sharps > 0 ? SHARP_NAMES : FLAT_NAMES;
    return `${names[pc]}${octave}`;
  }

  function noteNameToPc(name) {
    return (name in NOTE_TO_PC) ? NOTE_TO_PC[name] : 0;
  }

  function splitColon(numeral) {
    const idx = numeral.lastIndexOf(':');
    if (idx >= 0) {
      const base = numeral.slice(0, idx);
      const invS = numeral.slice(idx + 1);
      const n = parseInt(invS, 10);
      if (!isNaN(n) && /^-?\d+$/.test(invS)) {
        return [base, n];
      }
    }
    return [numeral, 0];
  }

  function parseNumeral(numeral, keyPc, sharps) {
    const [baseNum, colonInv] = splitColon(numeral);
    const s = baseNum.trim();

    // Secondary: V7/ii — resolve /ii first, use its root as new key
    if (s.indexOf('/') >= 0) {
      const idx = s.indexOf('/');
      const primaryStr = s.slice(0, idx);
      const secondaryStr = s.slice(idx + 1);
      const sec = parseNumeral(secondaryStr, keyPc, sharps);
      if (sec === null) return null;
      const newKeyPc = ((keyPc + sec.root_offset) % 12 + 12) % 12;
      const result = parseNumeral(primaryStr, newKeyPc, sharps);
      if (result) {
        result.name = `${result.name} / ${sec.name}`;
      }
      return result;
    }

    const m = s.match(RN_RE);
    if (!m) return null;
    const accS = m[1];
    const degS = m[2];
    const triadMod = m[3];
    const ext = m[4];
    const invS = m[5];
    // m[6] = secondary, already handled above

    const degUpper = degS.toUpperCase();
    if (!(degUpper in DEGREE_SEMITONES)) return null;

    const degOffset = DEGREE_SEMITONES[degUpper];
    const accOffset = {'b':-1,'bb':-2,'#':1,'##':2}[accS] || 0;
    const rootOffset = ((degOffset + accOffset) % 12 + 12) % 12;
    const rootPc = ((keyPc + rootOffset) % 12 + 12) % 12;

    const isUpper = degS[0] === degS[0].toUpperCase() && degS[0] !== degS[0].toLowerCase();

    // Base triad quality
    let base;
    if (triadMod === '+' || triadMod === 'aug') base = 'aug';
    else if (triadMod === 'o' || triadMod === 'dim') base = 'dim';
    else if (triadMod === 'h') base = 'halfdim';
    else if (isUpper) base = 'maj';
    else base = 'min';

    // Resolve quality from base + extension
    let quality;
    if (triadMod === 'h' || ext === 'm7b5') {
      quality = 'halfdim';
    } else if (ext === 'maj7' || ext === 'maj9') {
      quality = (base === 'maj') ? 'maj7' : (base === 'min' ? 'mmaj7' : 'maj7');
      if (ext === 'maj9') quality = 'maj9';
    } else if (ext === 'mMaj7') {
      quality = 'mmaj7';
    } else if (ext === '7') {
      const q = {'maj':'dom7','min':'m7','dim':'dim7','aug':'aug7','halfdim':'halfdim'};
      quality = (base in q) ? q[base] : 'dom7';
    } else if (ext === '9') {
      quality = (base === 'maj') ? 'dom9' : 'm9';
    } else if (ext === 'sus4') {
      quality = 'sus4';
    } else if (ext === 'sus47') {
      quality = 'sus47';
    } else if (ext === 'sus2') {
      quality = 'sus2';
    } else {
      quality = base;
    }

    if (!(quality in INTERVALS)) quality = base;

    const intervals = INTERVALS[quality];
    const figured = {'6':1,'64':2,'65':1,'43':2,'42':3};
    const defaultInversion = colonInv ? colonInv : (figured[invS] || 0);

    const pitchPcs = intervals.map(i => ((rootPc + i) % 12 + 12) % 12);
    const namesList = sharps > 0 ? SHARP_NAMES : FLAT_NAMES;
    const noteNames = pitchPcs.map(pc => namesList[pc]);

    return {
      root_offset: rootOffset,
      root_pc: rootPc,
      intervals: intervals,
      quality: quality,
      name: QUALITY_NAMES[quality] || quality,
      note_names: noteNames,
      default_inversion: defaultInversion,
    };
  }

  // ───────────────────────────────────────────────
  // Voicing engine
  // ───────────────────────────────────────────────

  function initialVoicing(noteNames, n) {
    n = n || 4;
    const result = [];
    let current = 48; // C3
    for (let i = 0; i < n; i++) {
      const name = noteNames[i % noteNames.length];
      const pc = noteNameToPc(name);
      const octave = Math.floor(current / 12) - 1;
      let midi = (octave + 1) * 12 + pc;
      while (midi < current) midi += 12;
      result.push(midi);
      current = midi + 2;
    }
    return result;
  }

  function voiceLeadStep(prev, noteNames) {
    const midiToName = {};
    const allCandidates = [];
    for (const name of noteNames) {
      const pc = noteNameToPc(name);
      for (let octave = 1; octave < 8; octave++) {
        const m = (octave + 1) * 12 + pc;
        midiToName[m] = name;
        allCandidates.push(m);
      }
    }

    const result = new Array(prev.length).fill(null);
    const usedMidis = new Set();
    const coveredNames = new Set();

    // Order voices by which has the closest possible candidate
    const order = prev.map((_, i) => i).sort((a, b) => {
      const minA = Math.min(...allCandidates.map(m => Math.abs(m - prev[a])));
      const minB = Math.min(...allCandidates.map(m => Math.abs(m - prev[b])));
      return minA - minB;
    });

    for (const i of order) {
      const uncovered = noteNames.filter(nm => !coveredNames.has(nm));
      let pool = allCandidates.filter(m => uncovered.indexOf(midiToName[m]) >= 0 && !usedMidis.has(m));
      if (pool.length === 0) {
        // All chord tones covered — must double. Prefer root, then 5th, never 3rd.
        const root = noteNames[0];
        const fifth = noteNames.length >= 3 ? noteNames[2] : null;
        let doublePool = allCandidates.filter(m => midiToName[m] === root && !usedMidis.has(m));
        if (doublePool.length === 0 && fifth)
          doublePool = allCandidates.filter(m => midiToName[m] === fifth && !usedMidis.has(m));
        if (doublePool.length === 0)
          doublePool = allCandidates.filter(m => !usedMidis.has(m));
        pool = doublePool;
      }
      if (pool.length === 0) pool = allCandidates.slice();
      let best = pool[0];
      let bestD = Math.abs(best - prev[i]);
      for (const m of pool) {
        const d = Math.abs(m - prev[i]);
        if (d < bestD) { bestD = d; best = m; }
      }
      result[i] = best;
      usedMidis.add(best);
      coveredNames.add(midiToName[best]);
    }

    return result;
  }

  function enforceInversion(voices, noteNames, inversion) {
    if (!noteNames || noteNames.length === 0 || inversion === -1) return voices;
    voices = voices.slice().sort((a, b) => a - b);
    const targetName = noteNames[((inversion % noteNames.length) + noteNames.length) % noteNames.length];
    const targetPc = noteNameToPc(targetName);

    if (((voices[0] % 12) + 12) % 12 === targetPc) return voices;

    const oldBassPc = ((voices[0] % 12) + 12) % 12;
    const ceiling = voices.length > 1 ? voices[1] : voices[0];
    let newBass = null;
    let bestDist = 999;
    for (let octave = 1; octave < 7; octave++) {
      const midi = (octave + 1) * 12 + targetPc;
      if (midi < ceiling) {
        const d = Math.abs(midi - voices[0]);
        if (d < bestDist) { bestDist = d; newBass = midi; }
      }
    }
    if (newBass === null) return voices;

    const oldBassPresentUpper = voices.slice(1).some(v => (((v % 12) + 12) % 12) === oldBassPc);
    const oldBassName = noteNames.find(n => noteNameToPc(n) === oldBassPc) || null;
    voices[0] = newBass;

    if (!oldBassPresentUpper && oldBassName) {
      for (let i = 1; i < voices.length; i++) {
        if ((((voices[i] % 12) + 12) % 12) === targetPc) {
          const ref = voices[i];
          let repl = null;
          let bestD = Infinity;
          for (let oct = 1; oct < 7; oct++) {
            const m = (oct + 1) * 12 + oldBassPc;
            const d = Math.abs(m - ref);
            if (d < bestD) { bestD = d; repl = m; }
          }
          voices[i] = repl;
          break;
        }
      }
    }

    return voices.slice().sort((a, b) => a - b);
  }

  // Traditional SATB ranges [lo, hi] in MIDI, index 0 = bass
  const SATB_RANGES = [[40,60],[48,67],[55,72],[60,79]];

  function applyVoicingStyle(voices, style) {
    let v = voices.slice().sort((a, b) => a - b);
    if (style === "drop2" && v.length >= 3) {
      v[v.length - 2] -= 12;
      v.sort((a, b) => a - b);
    } else if (style === "open" && v.length >= 3) {
      v[1] += 12;
      if (v.length >= 4) v[2] += 12;
      v.sort((a, b) => a - b);
    }
    v = v.map((midi, i) => {
      const [lo, hi] = SATB_RANGES[i] || [36, 84];
      while (midi < lo) midi += 12;
      while (midi > hi) midi -= 12;
      return midi;
    });
    return v.sort((a, b) => a - b);
  }

  function computeVoices(progression) {
    const keyPc = keyRootPc(progression.key);
    const sharps = sharpsOf(progression.key);
    const result = [];
    let prev = null;
    const nVoices = progression.n_voices || 4;
    const style = progression.voicing_style || 'close';
    for (const event of progression.chords) {
      const parsed = parseNumeral(event.numeral, keyPc, sharps);
      if (parsed === null) continue;
      const names = parsed.note_names;
      let voices = (prev === null)
        ? initialVoicing(names, nVoices)
        : voiceLeadStep(prev, names);
      voices = voices.slice().sort((a, b) => a - b);
      voices = enforceInversion(voices, names, event.inversion || 0);
      prev = voices.slice();
      voices = applyVoicingStyle(voices, style);
      result.push(voices);
    }
    return result;
  }

  // ───────────────────────────────────────────────
  // Public API: matches FastAPI surface
  // ───────────────────────────────────────────────

  function getChords(key, mode) {
    key = key || 'C';
    mode = mode || 'major';
    const keyPc = keyRootPc(key);
    const sharps = sharpsOf(key);
    const funcs = FUNCTION_MAP[mode] || FUNCTION_MAP['major'];
    const result = {};
    for (const fn of Object.keys(funcs)) {
      result[fn] = [];
      for (const n of funcs[fn]) {
        const parsed = parseNumeral(n, keyPc, sharps);
        if (parsed === null) continue;
        result[fn].push({
          numeral: n,
          name: parsed.name,
          pitches: parsed.note_names.map(nm => `${nm}4`),
          duration_default: 4.0,
          fn: fn,
          fn_role: FUNCTIONAL_ROLE[n] || fn,
          default_inversion: parsed.default_inversion,
        });
      }
    }
    return result;
  }

  function parseChord(numeral, key, mode) {
    key = key || 'C';
    const keyPc = keyRootPc(key);
    const sharps = sharpsOf(key);
    const parsed = parseNumeral(numeral, keyPc, sharps);
    if (parsed === null) return { error: `Cannot parse '${numeral}'` };
    return {
      numeral: numeral,
      name: parsed.name,
      pitches: parsed.note_names.map(nm => `${nm}4`),
      duration_default: 4.0,
      fn: null,
      default_inversion: parsed.default_inversion,
    };
  }

  function voiceLead(params) {
    const progression = normalizeProgression(params);
    const sharps = sharpsOf(progression.key);
    const keyPc = keyRootPc(progression.key);
    const allVoices = computeVoices(progression);
    const validChords = progression.chords.filter(
      e => parseNumeral(e.numeral, keyPc, sharps) !== null
    );
    const table = [];
    for (let i = 0; i < validChords.length; i++) {
      const event = validChords[i];
      const voices = allVoices[i];
      const row = { numeral: event.numeral, duration: event.duration, voices: [] };
      for (let j = 0; j < voices.length; j++) {
        const delta = i > 0 ? voices[j] - allVoices[i - 1][j] : null;
        row.voices.push({ pitch: spell(voices[j], sharps), delta: delta });
      }
      table.push(row);
    }
    const voicedChords = validChords.map((e, idx) => ({
      numeral: e.numeral,
      duration: e.duration,
      inversion: e.inversion || 0,
      voices: allVoices[idx],
    }));
    return {
      progression: Object.assign({}, progression, { chords: voicedChords }),
      table: table,
    };
  }

  function normalizeProgression(p) {
    return {
      key: p.key || 'C',
      mode: p.mode || 'major',
      tempo: p.tempo || 120,
      time_sig: p.time_sig || [4, 4],
      n_voices: p.n_voices || 4,
      voicing_style: p.voicing_style || 'close',
      voice_volumes: p.voice_volumes || [100, 85, 85, 75],
      chords: (p.chords || []).map(c => ({
        numeral: c.numeral,
        duration: (c.duration !== undefined) ? c.duration : 4.0,
        inversion: c.inversion || 0,
        voices: c.voices || [],
      })),
    };
  }

  // ───────────────────────────────────────────────
  // MIDI writer (Standard MIDI File, format 1)
  // ───────────────────────────────────────────────

  function writeVarLen(value) {
    // MIDI variable-length quantity
    const buf = [value & 0x7f];
    value >>>= 7;
    while (value > 0) {
      buf.unshift((value & 0x7f) | 0x80);
      value >>>= 7;
    }
    return buf;
  }

  function u16be(v) { return [(v >> 8) & 0xff, v & 0xff]; }
  function u32be(v) { return [(v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff]; }

  function buildTempoTrack(bpm) {
    const microsPerBeat = Math.round(60000000 / bpm);
    const events = [];
    // delta 0, FF 51 03 tt tt tt — set tempo
    events.push(...writeVarLen(0), 0xff, 0x51, 0x03,
      (microsPerBeat >> 16) & 0xff,
      (microsPerBeat >> 8) & 0xff,
      microsPerBeat & 0xff);
    // delta 0, FF 2F 00 — end of track
    events.push(...writeVarLen(0), 0xff, 0x2f, 0x00);
    return events;
  }

  function buildVoiceTrack(voiceIdx, validChords, allVoices, ticksPerBeat, velocity) {
    const events = [];
    // Track name meta: FF 03 len <name>
    const name = `Voice ${voiceIdx + 1}`;
    const nameBytes = [];
    for (let i = 0; i < name.length; i++) nameBytes.push(name.charCodeAt(i) & 0xff);
    events.push(...writeVarLen(0), 0xff, 0x03, ...writeVarLen(nameBytes.length), ...nameBytes);

    const channel = voiceIdx & 0x0f;
    const vel = Math.max(1, Math.min(127, velocity));
    for (let i = 0; i < validChords.length; i++) {
      const event = validChords[i];
      const note = allVoices[i][voiceIdx];
      const durTicks = Math.round(ticksPerBeat * event.duration);
      // note on, delta 0
      events.push(...writeVarLen(0), 0x90 | channel, note & 0x7f, vel & 0x7f);
      // note off after durTicks
      events.push(...writeVarLen(durTicks), 0x80 | channel, note & 0x7f, 0x00);
    }
    // End of track
    events.push(...writeVarLen(0), 0xff, 0x2f, 0x00);
    return events;
  }

  function wrapTrack(eventBytes) {
    return [0x4d, 0x54, 0x72, 0x6b, ...u32be(eventBytes.length), ...eventBytes];
  }

  function exportMidi(params) {
    const progression = normalizeProgression(params);
    const keyPc = keyRootPc(progression.key);
    const sharps = sharpsOf(progression.key);
    const allVoices = computeVoices(progression);
    const validChords = progression.chords.filter(
      e => parseNumeral(e.numeral, keyPc, sharps) !== null
    );
    const ticksPerBeat = 480;
    const nVoices = progression.n_voices;
    const volumes = progression.voice_volumes;

    const tracks = [];
    tracks.push(wrapTrack(buildTempoTrack(progression.tempo)));
    for (let v = 0; v < nVoices; v++) {
      const vel = (volumes[v] !== undefined) ? volumes[v] : 85;
      tracks.push(wrapTrack(buildVoiceTrack(v, validChords, allVoices, ticksPerBeat, vel)));
    }

    // Header: MThd, length 6, format 1, ntrks, division
    const header = [
      0x4d, 0x54, 0x68, 0x64,
      ...u32be(6),
      ...u16be(1),
      ...u16be(tracks.length),
      ...u16be(ticksPerBeat),
    ];

    // Flatten
    let total = header.length;
    for (const t of tracks) total += t.length;
    const out = new Uint8Array(total);
    let off = 0;
    out.set(header, off); off += header.length;
    for (const t of tracks) { out.set(t, off); off += t.length; }
    return out;
  }

  // ───────────────────────────────────────────────
  // Export
  // ───────────────────────────────────────────────

  const Engine = { getChords, parseChord, voiceLead, exportMidi, spell };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = Engine;
  } else {
    global.Engine = Engine;
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<header>

<script>
const LS_KEY = 'harmonysplorer_v1';
let progression = [];
const DEBUG = new URLSearchParams(location.search).has('debug');
function dbg(msg) {
  if (!DEBUG) return;
  const el = document.getElementById('dbg');
  if (el) el.textContent = new Date().toISOString().slice(11,23) + ' ' + msg + '\n' + el.textContent.slice(0,800);
}

let chordData = {};
let audioCtx = null;
let previewTimeout = null;
let activeNodes = [];
let isLooping = false;
let isPlaying = false;
let loopTimeout = null;
let pickerView = 'function';
let voiceVolumes = [100, 85, 85, 75];
let oscType = 'triangle';
let dragSrcIndex = null;
let sectionCollapsed = {};

const FN_LABELS = { tonic:'Tonic', predominant:'Pre-dominant', dominant:'Dominant' };
const CATS = ['diatonic','borrowed','secondary'];
let activeCategories = new Set(CATS);

// ── Persistence ──
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    progression, voiceVolumes, oscType,
    key: document.getElementById('key-select').value,
    mode: document.getElementById('mode-select').value,
    tempo: document.getElementById('tempo').value,
    voicing: document.getElementById('voicing-select').value,
    pickerWidth: getComputedStyle(document.documentElement).getPropertyValue('--picker-width').trim(),
  }));
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (!s) return;
    if (s.key) document.getElementById('key-select').value = s.key;
    if (s.mode) document.getElementById('mode-select').value = s.mode;
    if (s.tempo) document.getElementById('tempo').value = s.tempo;
    if (s.voicing) document.getElementById('voicing-select').value = s.voicing;
    if (Array.isArray(s.progression)) progression = s.progression;
    if (Array.isArray(s.voiceVolumes)) voiceVolumes = s.voiceVolumes;
    if (s.oscType) { oscType = s.oscType; const w = document.getElementById('wave-select'); if (w) w.value = oscType; }
    if (s.pickerWidth) document.documentElement.style.setProperty('--picker-width', s.pickerWidth);
  } catch {}
}

// ── Init ──
async function init() {
  loadState();
  // Prevent table scroll container from stealing wheel events over inputs
  document.getElementById('unified-table-wrap').addEventListener('wheel', e => {
    if (e.target.tagName === 'INPUT') e.preventDefault();
  }, {passive: false});
  initDragHandle();
  renderCatFilters();
  loadChords();
  await initAudio();
  renderUnified();
}

// ── Drag handle ──
function initDragHandle() {
  const handle = document.getElementById('drag-handle');
  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    handle.classList.add('dragging');
    const startX = e.clientX;
    const startW = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--picker-width'));
    const onMove = e => {
      const w = Math.max(180, Math.min(520, startW + e.clientX - startX));
      document.documentElement.style.setProperty('--picker-width', w + 'px');
    };
    const onUp = () => {
      handle.classList.remove('dragging');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      saveState();
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });
}

// ── Chords ──
function loadChords() {
  const key = document.getElementById('key-select').value;
  const mode = document.getElementById('mode-select').value;
  chordData = Engine.getChords(key, mode);
  renderPicker();
  updateUnifiedVoices();
}

document.getElementById('key-select').addEventListener('change', () => { loadChords(); saveState(); });
document.getElementById('mode-select')?.addEventListener('change', () => { loadChords(); saveState(); });

const voicingEl = document.getElementById('voicing-select');
const tempoEl   = document.getElementById('tempo');
const waveEl    = document.getElementById('wave-select');
voicingEl.addEventListener('change', () => { updateUnifiedVoices(); saveState(); });
tempoEl.addEventListener('change', saveState);
waveEl.addEventListener('change', () => { oscType = waveEl.value; saveState(); });

// Wheel helpers
let wheelCD = new WeakMap();
function wcd(el, ms=150) { if (wheelCD.get(el)) return true; wheelCD.set(el, true); setTimeout(()=>wheelCD.set(el,false), ms); return false; }
function addWheelSelect(el, cb) { el.addEventListener('wheel', e => { e.preventDefault(); if(wcd(el)) return; const dir=e.deltaY>0?1:-1; const n=Math.max(0,Math.min(el.options.length-1,el.selectedIndex+dir)); if(n!==el.selectedIndex){el.selectedIndex=n;cb(el);} }, {passive:false}); }
function addWheelNumber(el, step, min, max, cb) { el.addEventListener('wheel', e => { e.preventDefault(); if(wcd(el)) return; const dir=e.deltaY>0?-1:1; const v=Math.min(max,Math.max(min,parseFloat(el.value)+dir*step)); if(v!==parseFloat(el.value)){el.value=v;cb(el);} }, {passive:false}); }

addWheelSelect(document.getElementById('key-select'), () => { loadChords(); saveState(); });
const modeEl = document.getElementById('mode-select');
if (modeEl) { addWheelSelect(modeEl, () => { loadChords(); saveState(); }); }
addWheelSelect(voicingEl, () => { updateUnifiedVoices(); saveState(); });
addWheelSelect(waveEl, () => { oscType = waveEl.value; saveState(); });
addWheelNumber(tempoEl, 5, 40, 240, () => saveState());

// ── Audio ──
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
}

// Desktop autoplay policy requires a click before audio plays
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked || !audioCtx) return;
  audioCtx.resume().catch(() => {});
  audioUnlocked = true;
  const hint = document.getElementById('audio-hint');
  if (hint) hint.style.opacity = '0';
}
document.addEventListener('click', unlockAudio, false);

async function ensureAudio() {
  if (!audioCtx) return;
  if (audioCtx.state !== 'running') await audioCtx.resume();
}

function stopPreview() {
  const now = audioCtx?.currentTime ?? 0;
  for (const {osc, gain} of activeNodes) {
    try { gain.gain.cancelScheduledValues(now); gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now+0.12); osc.stop(now+0.13); } catch {}
  }
  activeNodes = [];
}

function playNote(midi, duration=1.5, time=0, volumeMul=1.0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = 440 * Math.pow(2, (midi-69)/12);
  osc.type = oscType;
  const start = audioCtx.currentTime + time;
  const peak = 0.15 * volumeMul;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(peak, start+0.01);
  gain.gain.setValueAtTime(peak, start+duration-0.04);
  gain.gain.linearRampToValueAtTime(0, start+duration);
  osc.start(start); osc.stop(start+duration+0.05);
  activeNodes.push({osc, gain});
}

function previewChordByData(c) {
  const inv = c.default_inversion ?? 0;
  let midis = c.pitches.map(pitchNameToMidi).filter(Boolean);
  // Clamp to comfortable range
  midis = midis.map(m => { while (m < 48) m += 12; while (m > 72) m -= 12; return m; });
  // Enforce inversion: ensure the right pitch class is lowest
  if (inv > 0 && inv < midis.length) {
    const bassPC = midis[inv] % 12;
    const minMidi = Math.min(...midis);
    if (minMidi % 12 !== bassPC) {
      const idx = midis.findIndex(m => m % 12 === bassPC);
      if (idx !== -1) {
        let b = midis[idx];
        while (b >= minMidi) b -= 12;
        if (b >= 36) midis[idx] = b;
      }
    }
  }
  ensureAudio().then(() => midis.sort((a,b) => a-b).forEach(midi => playNote(midi, 1.8, 0)));
}

function formatPitch(name) {
  return name.replace(/([A-G])-(\d)/, '$1♭$2').replace(/([A-G])#(\d)/, '$1♯$2');
}

function pitchNameToMidi(name) {
  const match = name.match(/^([A-G][#b\-]{0,2})(-?\d+)$/);
  if (!match) return null;
  const nm = {'C':0,'C#':1,'Db':1,'D':2,'D#':3,'D-':1,'Eb':3,'E-':3,'E':4,'E#':5,
               'F':5,'F#':6,'F-':4,'Gb':6,'G':7,'G#':8,'G-':6,'Ab':8,'A-':8,'A':9,
               'A#':10,'Bb':10,'B-':10,'B':11,'B#':0,'Cb':11,'C-':11};
  return (parseInt(match[2])+1)*12 + (nm[match[1]] ?? 0);
}

// ── Playback ──
function stopPlayback() {
  isPlaying = false; clearTimeout(loopTimeout); stopPreview();
  document.getElementById('play-btn').textContent = '▶ Play';
}
function togglePlay() { if (isPlaying) { stopPlayback(); return; } startPlayback(); }
function toggleLoop() {
  isLooping = !isLooping;
  const btn = document.getElementById('loop-btn');
  btn.style.color = isLooping ? 'var(--accent)' : '';
  btn.style.borderColor = isLooping ? 'var(--accent)' : '';
}
async function startPlayback() {
  if (!progression.length) return;
  await ensureAudio();
  isPlaying = true;
  document.getElementById('play-btn').textContent = '■ Stop';
  await playProgression();
}
async function playProgression() {
  if (!isPlaying) return;
  const bps = parseInt(tempoEl.value) / 60;
  let time = 0;
  try {
    const voiced = fetchVoiceLeading();
    for (const row of voiced.table) {
      const dur = row.duration / bps;
      row.voices.forEach((v, vi) => {
        const midi = pitchNameToMidi(v.pitch);
        if (midi) playNote(midi, dur*0.92, time, voiceVolumes[vi]/100);
      });
      time += dur;
    }
  } catch { time = 2; }
  if (isPlaying) {
    loopTimeout = setTimeout(() => {
      if (isLooping || time > 0) playProgression();
      else { isPlaying = false; document.getElementById('play-btn').textContent = '▶ Play'; }
    }, time*1000);
  }
}

// ── Mixer ──
function renderMixer() {
  const el = document.getElementById('voice-mixer');
  el.innerHTML = '';
  voiceVolumes.forEach((vol, i) => {
    const ch = document.createElement('div');
    ch.className = 'voice-channel';
    ch.innerHTML = `<label>${['B','T','A','S'][i]||'V'+(i+1)}</label><input type="range" min="0" max="100" value="${vol}" orient="vertical"><span class="vol-num">${vol}</span>`;
    const slider = ch.querySelector('input');
    const num = ch.querySelector('.vol-num');
    const update = v => { voiceVolumes[i]=parseInt(v); num.textContent=v; saveState(); };
    slider.addEventListener('input', e => update(e.target.value));
    addWheelNumber(slider, 5, 0, 100, el => update(el.value));
    el.appendChild(ch);
  });
}

// ── Picker ──
function chordCategory(c) {
  if (c.fn==='borrowed') return 'borrowed';
  if (c.fn==='secondary') return 'secondary';
  return 'diatonic';
}

function renderCatFilters() {
  const el = document.getElementById('cat-filters');
  el.innerHTML = '';
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (activeCategories.has(cat) ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      if (activeCategories.has(cat)) { if (activeCategories.size > 1) activeCategories.delete(cat); }
      else activeCategories.add(cat);
      renderCatFilters(); renderPicker();
    });
    el.appendChild(btn);
  });
}

function togglePickerView() {
  pickerView = pickerView === 'type' ? 'function' : 'type';
  const btn = document.getElementById('view-toggle');
  btn.textContent = pickerView === 'function' ? 'by fn' : 'by type';
  btn.style.color = pickerView === 'function' ? 'var(--accent)' : 'var(--text3)';
  renderPicker();
}

function makeChordBtn(c) {
  const btn = document.createElement('button');
  btn.className = 'chord-btn';
  btn.textContent = c.numeral;
  btn.addEventListener('mouseenter', () => {
    setStatus(`${c.numeral} — ${c.name} (${c.pitches.map(formatPitch).join(', ')}) · click to add`);
    if (isPlaying) return;
    clearTimeout(previewTimeout);
    previewTimeout = setTimeout(() => previewChordByData(c), 80);
  });
  btn.addEventListener('mouseleave', () => {
    clearTimeout(previewTimeout);
    if (!isPlaying) stopPreview();
    setStatus('hover a chord to preview · click to add');
  });
  btn.addEventListener('click', () => addChord(c.numeral, c.duration_default, c.fn, c.default_inversion ?? 0));
  return btn;
}

function renderPicker() {
  const container = document.getElementById('chord-picker');
  container.innerHTML = '';
  const groups = { tonic:[], predominant:[], dominant:[] };
  for (const chords of Object.values(chordData)) {
    for (const c of chords) {
      const role = c.fn_role || c.fn;
      if (!groups[role]) continue;
      if (activeCategories.has(chordCategory(c))) groups[role].push(c);
    }
  }
  for (const [role, chords] of Object.entries(groups)) {
    if (!chords.length) continue;
    const group = document.createElement('div');
    group.className = 'fn-group';
    group.innerHTML = `<div class="fn-label">${FN_LABELS[role]}</div>`;
    const diatonic = chords.filter(c => chordCategory(c) === 'diatonic');
    const other    = chords.filter(c => chordCategory(c) !== 'diatonic');
    const addGrid = cs => {
      const g = document.createElement('div'); g.className = 'fn-buttons';
      cs.forEach(c => g.appendChild(makeChordBtn(c))); group.appendChild(g);
    };
    if (diatonic.length) addGrid(diatonic);
    if (diatonic.length && other.length) group.appendChild(Object.assign(document.createElement('hr'), {className:'fn-divider'}));
    if (other.length) addGrid(other);
    container.appendChild(group);
  }
}

async function addCustomChord() {
  const input = document.getElementById('custom-numeral');
  const numeral = input.value.trim();
  if (!numeral) return;
  const key = document.getElementById('key-select').value;
  const mode = document.getElementById('mode-select').value;
  const data = Engine.parseChord(numeral, key, mode);
  if (data.error) { setStatus(`Error: ${data.error}`); return; }
  if (!isPlaying) previewChordByData(data);
  addChord(data.numeral, data.duration_default, null, data.default_inversion ?? 0);
  input.value = '';
}

document.getElementById('custom-numeral')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') addCustomChord();
  if (e.key === 'Backspace' && e.target.value === '' && progression.length > 0) {
    e.preventDefault(); removeChord(progression.length - 1);
  }
});

// ── Progression ──
function addChord(numeral, duration=4.0, fn=null, defaultInversion=0) {
  const last = progression[progression.length-1];
  if (last && last.numeral === numeral) { last.duration *= 2; }
  else progression.push({numeral, duration, fn, inversion: defaultInversion});
  renderUnified(); renderPicker(); saveState();
}

function removeChord(i) {
  progression.splice(i, 1); renderUnified(); renderPicker(); saveState();
}

function clearProgression() {
  progression = []; renderUnified(); renderPicker(); saveState();
}

function isSeventhChord(numeral) { return /7|maj7|h7|o7/.test(numeral); }

function getTimeSig() { return 4; }

// ── Unified table ──
function renderUnified() {
  const head = document.getElementById('ut-head');
  const body = document.getElementById('ut-body');
  if (!progression.length) {
    head.innerHTML = '';
    body.innerHTML = `<tr><td colspan="10" style="color:var(--text3);padding:12px">add chords to see voice leading</td></tr>`;
    return;
  }

  let voiceData = null;
  try { voiceData = fetchVoiceLeading(); } catch {}

  const nv = 4;
  head.innerHTML = `<th></th><th>chord</th><th>dur</th>` +
    Array.from({length:nv}, (_,i) => `<th class="th-voice" id="th-v${i}"></th>`).join('') + `<th></th>`;
  // Inject sliders into voice header cells
  for (let i = 0; i < nv; i++) {
    const th = document.getElementById(`th-v${i}`);
    const ch = document.createElement('div'); ch.className = 'voice-channel';
    ch.innerHTML = `<label>${['B','T','A','S'][i]||'V'+(i+1)}</label><input type="range" min="0" max="100" value="${voiceVolumes[i]}" orient="vertical"><span class="vol-num">${voiceVolumes[i]}</span>`;
    const slider = ch.querySelector('input'), num = ch.querySelector('.vol-num');
    const update = v => { voiceVolumes[i] = parseInt(v); num.textContent = v; saveState(); };
    slider.addEventListener('input', e => update(e.target.value));
    addWheelNumber(slider, 5, 0, 100, el => update(el.value));
    th.appendChild(ch);
  }

  const parallels = voiceData ? detectParallels(voiceData.table) : new Set();

  let beatCursor = 0;
  body.innerHTML = '';
  progression.forEach((c, i) => {
    const bar = Math.floor(beatCursor / getTimeSig()) + 1;
    const beat = (beatCursor % getTimeSig()) + 1;
    const barLabel = beat === 1 ? `m.${bar}` : `m.${bar}.${beat}`;
    beatCursor += c.duration;

    const row = document.createElement('tr');
    row.draggable = true;

    // Voice pitch cells
    let voiceCells = Array.from({length:nv}, (_,vi) => `<td class="td-pitch">—</td>`).join('');
    if (voiceData && voiceData.table[i]) {
      const vtRow = voiceData.table[i];
      voiceCells = vtRow.voices.map((v, vi) => {
        const d = v.delta;
        let cls = 'td-pitch';
        if (d !== null) cls += d > 0 ? ' delta-pos' : d < 0 ? ' delta-neg' : ' delta-zero';
        if (parallels.has(`${i}:${vi}`)) cls += ' parallel-warn';
        const dstr = d === null ? '' : d === 0 ? ' —' : ` ${d>0?'+':''}${d}`;
        return `<td class="${cls}">${formatPitch(v.pitch)}<span style="font-size:0.6rem;color:var(--text3)">${dstr}</span></td>`;
      }).join('');
    }

    row.innerHTML = `
      <td class="td-bar">${barLabel}</td>
      <td><input class="td-numeral-input" value="${c.numeral}" spellcheck="false"></td>
      <td><input class="td-dur" type="number" value="${c.duration}" min="0.5" max="64" step="0.5"></td>
      ${voiceCells}
      <td><button class="td-remove">×</button></td>
    `;

    // Editable numeral
    const numInput = row.querySelector('.td-numeral-input');
    numInput.addEventListener('change', async e => {
      const key = document.getElementById('key-select').value;
      const mode = document.getElementById('mode-select').value;
      const val = e.target.value.trim();
      const data = Engine.parseChord(val, key, mode);
      if (data.error) { e.target.value = c.numeral; setStatus(`Error: ${data.error}`); return; }
      progression[i].numeral = val;
      progression[i].inversion = data.default_inversion ?? 0;
      renderUnified(); saveState();
    });
    numInput.addEventListener('keydown', e => { if (e.key==='Enter') e.target.blur(); if (e.key==='Escape') { e.target.value=c.numeral; e.target.blur(); } });

    const durInput = row.querySelector('.td-dur');
    durInput.addEventListener('change', e => { progression[i].duration = parseFloat(e.target.value); renderUnified(); saveState(); });
    let durTimer = null;
    addWheelNumber(durInput, 0.5, 0.5, 64, el => {
      progression[i].duration = parseFloat(el.value);
      saveState();
      clearTimeout(durTimer);
      durTimer = setTimeout(() => renderUnified(), 180);
    });

    row.querySelector('.td-remove').addEventListener('click', e => { e.stopPropagation(); removeChord(i); });

    // Drag reorder
    row.addEventListener('dragstart', e => { dragSrcIndex = i; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', e => { e.preventDefault(); document.querySelectorAll('#unified-table tr').forEach(r => r.classList.remove('drag-over')); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault(); row.classList.remove('drag-over');
      if (dragSrcIndex === null || dragSrcIndex === i) return;
      const moved = progression.splice(dragSrcIndex, 1)[0];
      progression.splice(i, 0, moved);
      dragSrcIndex = null; renderUnified(); saveState();
    });

    body.appendChild(row);
  });
}

function updateUnifiedVoices() { renderUnified(); }

function fetchVoiceLeading() {
  const key = document.getElementById('key-select').value;
  const mode = document.getElementById('mode-select').value;
  const tempo = parseInt(tempoEl.value);
  return Engine.voiceLead({key, mode, tempo, time_sig:[4,4], n_voices:4,
    voicing_style: voicingEl.value, voice_volumes: voiceVolumes,
    chords: progression.map(c => ({numeral:c.numeral, duration:c.duration, inversion:c.inversion??0}))});
}

function detectParallels(table) {
  const warned = new Set();
  for (let i=1; i<table.length; i++) {
    const prev=table[i-1].voices, curr=table[i].voices;
    const pm=prev.map(v=>pitchNameToMidi(v.pitch)), cm=curr.map(v=>pitchNameToMidi(v.pitch));
    for (let a=0; a<prev.length; a++) for (let b=a+1; b<prev.length; b++) {
      if (!pm[a]||!pm[b]||!cm[a]||!cm[b]) continue;
      const pi=Math.abs(pm[a]-pm[b])%12, ci=Math.abs(cm[a]-cm[b])%12;
      if (pi===ci&&(ci===7||ci===0)&&curr[a].delta!==0&&curr[b].delta!==0&&curr[a].delta!==null)
        { warned.add(`${i}:${a}`); warned.add(`${i}:${b}`); }
    }
  }
  return warned;
}

// ── Export ──
function exportMidi() {
  if (!progression.length) return;
  const key=document.getElementById('key-select').value, mode=document.getElementById('mode-select').value, tempo=parseInt(tempoEl.value);
  const bytes = Engine.exportMidi({key,mode,tempo,time_sig:[4,4],n_voices:4,voicing_style:voicingEl.value,
    voice_volumes:voiceVolumes, chords:progression.map(c=>({numeral:c.numeral,duration:c.duration,inversion:c.inversion??0}))});
  const blob = new Blob([bytes], {type:'audio/midi'});
  Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:'harmonysplorer.mid'}).click();
}

function exportProject() {
  const state = {progression, voiceVolumes, oscType,
    key:document.getElementById('key-select').value, mode:document.getElementById('mode-select').value,
    tempo:document.getElementById('tempo').value, voicing:voicingEl.value,
    pickerWidth: getComputedStyle(document.documentElement).getPropertyValue('--picker-width').trim()};
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),
    download: `harmonysplorer_${state.key}${state.mode}_${Date.now()}.json`});
  a.click();
}

function importProject(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const s = JSON.parse(ev.target.result);
      if (s.key) document.getElementById('key-select').value = s.key;
      if (s.mode) document.getElementById('mode-select').value = s.mode;
      if (s.tempo) document.getElementById('tempo').value = s.tempo;
      if (s.voicing) voicingEl.value = s.voicing;
      if (Array.isArray(s.progression)) progression = s.progression;
      if (Array.isArray(s.voiceVolumes)) voiceVolumes = s.voiceVolumes;
      if (s.oscType) oscType = s.oscType;
      if (s.pickerWidth) document.documentElement.style.setProperty('--picker-width', s.pickerWidth);
      saveState(); loadChords(); renderUnified();
      setStatus(`Loaded ${file.name}`);
    } catch { setStatus('Import failed — invalid JSON'); }
  };
  reader.readAsText(file); e.target.value = '';
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

init();
</script>
