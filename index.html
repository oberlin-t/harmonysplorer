<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Harmonysplorer</title>
<style>
  :root {
    --bg:       #0b120b;
    --surf1:    #111e11;
    --surf2:    #172317;
    --surf3:    #1e2e1e;
    --border:   #263826;
    --border2:  #3a5a3a;
    --text:     #b8d4b0;
    --text2:    #6a9a6a;
    --text3:    #3d5e3d;
    --accent:   #4dba4d;
    --accent2:  #2e7a2e;
    --neg:      #b06060;
    --warn-bg:  #1e1a00;
    --warn:     #aa9900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  header { padding: 10px 16px; background: var(--surf1); border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 0.9rem; color: var(--accent); letter-spacing: 0.15em; }
  select, input[type=number] { background: var(--surf2); color: var(--text); border: 1px solid var(--border2); padding: 3px 7px; font-family: monospace; font-size: 0.82rem; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  label { color: var(--text3); font-size: 0.78rem; margin-right: 3px; }

  main { display: grid; grid-template-columns: 280px 1fr 1fr; flex: 1; overflow: hidden; }

  .panel { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
  .panel h2 { font-size: 0.65rem; letter-spacing: 0.15em; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }

  .fn-group { margin-bottom: 12px; }
  .fn-label { font-size: 0.6rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 5px; }
  .cat-filters { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .cat-btn {
    font-size: 0.58rem; background: var(--surf2); border: 1px solid var(--border);
    color: var(--text3); padding: 2px 8px; cursor: pointer; font-family: monospace;
  }
  .cat-btn.active { border-color: var(--accent2); color: var(--accent); background: var(--surf3); }
  .fn-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .fn-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; margin-bottom: 2px; }
  .chord-btn {
    display: block; width: 100%; text-align: left;
    background: var(--surf2); border: 1px solid var(--border); color: var(--text2);
    padding: 5px 7px; cursor: pointer; font-family: monospace; font-size: 0.8rem;
    transition: background 0.08s, border-color 0.08s; overflow: hidden; white-space: nowrap;
  }
  .chord-btn:hover { background: var(--surf3); border-color: var(--border2); color: var(--text); }
  .chord-btn .name { font-size: 0.6rem; color: var(--text3); margin-left: 3px; }
  .custom-input { display: flex; gap: 4px; margin-top: 10px; }
  .custom-input input {
    flex: 1; background: var(--surf2); border: 1px solid var(--border2); color: var(--text);
    font-family: monospace; font-size: 0.82rem; padding: 5px 8px;
  }
  .custom-input button {
    background: var(--surf2); border: 1px solid var(--border2); color: var(--text2);
    font-family: monospace; font-size: 0.85rem; padding: 5px 11px; cursor: pointer;
  }
  .custom-input button:hover { background: var(--surf3); color: var(--text); }

  #progression-panel { display: flex; flex-direction: column; }
  #chord-list { flex: 1; overflow-y: auto; }
  .chord-item {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    cursor: grab;
  }
  .chord-item:hover { background: var(--surf2); }
  .chord-item.dragging { opacity: 0.4; }
  .chord-item.drag-over { border-top: 2px solid var(--accent); }
  .chord-item .bar-num { font-size: 0.58rem; color: var(--text3); width: 32px; flex-shrink: 0; }
  .chord-item .numeral { min-width: 52px; font-size: 0.9rem; color: var(--text); }
  .chord-item .dur-input {
    width: 46px; background: var(--surf2); border: 1px solid var(--border);
    color: var(--text2); font-family: monospace; font-size: 0.78rem; padding: 2px 4px;
  }
  .chord-item .beats-label { font-size: 0.68rem; color: var(--text3); }
  .chord-item .inv-select {
    background: var(--surf2); border: 1px solid var(--border); color: var(--text3);
    font-family: monospace; font-size: 0.72rem; padding: 2px 3px;
  }
  .chord-item .remove-btn { margin-left: auto; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1rem; }
  .chord-item .remove-btn:hover { color: var(--neg); }

  .prog-actions { padding: 8px 10px; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  button.action, label.action {
    background: var(--surf2); border: 1px solid var(--border2); color: var(--text2);
    padding: 5px 8px; font-family: monospace; font-size: 0.75rem; cursor: pointer;
    text-align: center; display: block;
  }
  button.action:hover, label.action:hover { background: var(--surf3); color: var(--text); }
  button.action.primary { border-color: var(--accent); color: var(--accent); }
  button.action.primary:hover { background: var(--surf3); }

  .voice-mixer { display: flex; gap: 4px; padding: 8px 8px 6px; border-bottom: 1px solid var(--border); }
  .voice-channel { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
  .voice-channel label { font-size: 0.6rem; color: var(--text3); }
  .voice-channel input[type=range] {
    -webkit-appearance: slider-vertical; writing-mode: vertical-lr;
    width: 20px; height: 60px; cursor: pointer;
    accent-color: var(--accent);
  }
  .voice-channel .vol-num { font-size: 0.62rem; color: var(--text2); }

  #voice-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  #voice-table th { color: var(--text3); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); font-weight: normal; }
  #voice-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  #voice-table tr:hover td { background: var(--surf2); }
  .delta-pos { color: var(--accent); }
  .delta-neg { color: var(--neg); }
  .delta-zero { color: var(--text3); }
  .parallel-warn { background: var(--warn-bg) !important; }
  .parallel-warn::after { content: ' ⚠'; font-size: 0.6rem; color: var(--warn); }

  #status { padding: 5px 16px; background: var(--surf1); border-top: 1px solid var(--border); font-size: 0.68rem; color: var(--text3); }
  .view-toggle { font-size: 0.58rem; background: var(--surf2); border: 1px solid var(--border2); color: var(--accent); padding: 2px 7px; cursor: pointer; font-family: monospace; }
</style>
</head>
<body>

<header>
  <h1>HARMONYSPLORER</h1>
  <label>Key <select id="key-select">
    <option>C</option><option>G</option><option>D</option><option>A</option><option>E</option><option>B</option>
    <option>F</option><option>Bb</option><option>Eb</option><option>Ab</option><option>Db</option><option>F#</option>
  </select></label>
  <label>Mode <select id="mode-select">
    <option value="major">major</option>
    <option value="minor">minor</option>
  </select></label>
  <label>Tempo <input type="number" id="tempo" value="120" min="40" max="240" style="width:58px"></label>
  <label>Voicing <select id="voicing-select">
    <option value="close">close</option>
    <option value="drop2">drop-2</option>
    <option value="open">open</option>
  </select></label>
</header>

<main>
  <div class="panel" id="picker-panel">
    <h2>Chords</h2>
    <div class="cat-filters" id="cat-filters"></div>
    <div id="chord-picker"></div>
    <div class="custom-input">
      <input id="custom-numeral" type="text" placeholder="e.g. bII, V7/IV" spellcheck="false">
      <button onclick="addCustomChord()">+</button>
    </div>
  </div>

  <div class="panel" id="progression-panel">
    <h2>Progression</h2>
    <div id="chord-list"></div>
    <div class="prog-actions">
      <button class="action primary" id="play-btn" onclick="togglePlay()">▶ Play</button>
      <button class="action" id="loop-btn" onclick="toggleLoop()">⟳ Loop</button>
      <button class="action" onclick="exportMidi()">⬇ MIDI</button>
      <button class="action" onclick="exportProject()">⬇ JSON</button>
      <label class="action" style="cursor:pointer">⬆ JSON<input type="file" accept=".json" style="display:none" onchange="importProject(event)"></label>
      <button class="action" onclick="clearProgression()">✕ Clear</button>
    </div>
  </div>

  <div class="panel">
    <h2>Voice Leading</h2>
    <div class="voice-mixer" id="voice-mixer"></div>
    <table id="voice-table">
      <thead><tr id="vt-head"></tr></thead>
      <tbody id="vt-body"></tbody>
    </table>
  </div>
</main>

<div id="status">hover a chord to preview · click to add</div>

<script>
const LS_KEY = 'harmonysplorer_v1';

let progression = [];
let chordData = {};
let audioCtx = null;
let previewTimeout = null;
let activeNodes = [];
let isLooping = false;
let isPlaying = false;
let loopTimeout = null;
const FN_LABELS = { tonic: 'Tonic', predominant: 'Pre-dominant', dominant: 'Dominant' };
let voiceVolumes = [100, 85, 85, 75]; // V1–V4 default levels
const CATS = ['diatonic', 'borrowed', 'secondary'];
let activeCategories = new Set(CATS);

function renderMixer() {
  const el = document.getElementById('voice-mixer');
  el.innerHTML = '';
  voiceVolumes.forEach((vol, i) => {
    const ch = document.createElement('div');
    ch.className = 'voice-channel';
    ch.innerHTML = `
      <label>V${i+1}</label>
      <input type="range" min="0" max="100" value="${vol}" orient="vertical">
      <span class="vol-num">${vol}</span>
    `;
    const slider = ch.querySelector('input');
    const num = ch.querySelector('.vol-num');
    const update = v => {
      voiceVolumes[i] = parseInt(v);
      num.textContent = v;
      saveState();
    };
    slider.addEventListener('input', e => update(e.target.value));
    addWheelNumber(slider, 5, 0, 100, el => update(el.value));
    el.appendChild(ch);
  });
}

function chordCategory(c) {
  if (c.fn === 'borrowed') return 'borrowed';
  if (c.fn === 'secondary') return 'secondary';
  return 'diatonic';
}

// --- Wheel scroll helpers ---
let wheelCD = new WeakMap();
function wheelCooldown(el, ms = 150) {
  if (wheelCD.get(el)) return true;
  wheelCD.set(el, true);
  setTimeout(() => wheelCD.set(el, false), ms);
  return false;
}

function addWheelSelect(el, onChange) {
  el.addEventListener('wheel', e => {
    e.preventDefault();
    if (wheelCooldown(el)) return;
    const dir = e.deltaY > 0 ? 1 : -1;
    const next = Math.max(0, Math.min(el.options.length - 1, el.selectedIndex + dir));
    if (next !== el.selectedIndex) { el.selectedIndex = next; onChange(el); }
  }, { passive: false });
}

function addWheelNumber(el, step, min, max, onChange) {
  el.addEventListener('wheel', e => {
    e.preventDefault();
    if (wheelCooldown(el)) return;
    const dir = e.deltaY > 0 ? -1 : 1;
    const val = Math.min(max, Math.max(min, parseFloat(el.value) + dir * step));
    if (val !== parseFloat(el.value)) { el.value = val; onChange(el); }
  }, { passive: false });
}

function renderCatFilters() {
  const el = document.getElementById('cat-filters');
  el.innerHTML = '';
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (activeCategories.has(cat) ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      if (activeCategories.has(cat)) {
        if (activeCategories.size > 1) activeCategories.delete(cat);
      } else {
        activeCategories.add(cat);
      }
      renderCatFilters();
      renderPicker();
    });
    el.appendChild(btn);
  });
}

// --- Persistence ---
function saveState() {
  const state = {
    progression,
    key: document.getElementById('key-select').value,
    mode: document.getElementById('mode-select').value,
    tempo: document.getElementById('tempo').value,
    voicing: document.getElementById('voicing-select').value,
    voiceVolumes,
  };
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.key) document.getElementById('key-select').value = s.key;
    if (s.mode) document.getElementById('mode-select').value = s.mode;
    if (s.tempo) document.getElementById('tempo').value = s.tempo;
    if (s.voicing) document.getElementById('voicing-select').value = s.voicing;
    if (Array.isArray(s.progression)) progression = s.progression;
    if (Array.isArray(s.voiceVolumes)) voiceVolumes = s.voiceVolumes;
  } catch {}
}

// --- Init ---
async function init() {
  loadState();
  renderCatFilters();
  renderMixer();
  await loadChords();
  await initAudio();
  renderProgression();
  updateVoiceTable();
}

async function loadChords() {
  const key = document.getElementById('key-select').value;
  const mode = document.getElementById('mode-select').value;
  const res = await fetch(`/chords?key=${key}&mode=${mode}`);
  chordData = await res.json();
  renderPicker();
}

const keyEl = document.getElementById('key-select');
const modeEl = document.getElementById('mode-select');
const voicingEl = document.getElementById('voicing-select');
const tempoEl = document.getElementById('tempo');

keyEl.addEventListener('change', () => { loadChords(); saveState(); });
modeEl.addEventListener('change', () => { loadChords(); saveState(); });
voicingEl.addEventListener('change', () => { updateVoiceTable(); saveState(); });
tempoEl.addEventListener('change', saveState);

addWheelSelect(keyEl,     () => { loadChords(); saveState(); });
addWheelSelect(modeEl,    () => { loadChords(); saveState(); });
addWheelSelect(voicingEl, () => { updateVoiceTable(); saveState(); });
addWheelNumber(tempoEl, 5, 40, 240, () => saveState());

// --- Audio ---
async function initAudio() {
  audioCtx = new AudioContext();
}

function stopPreview() {
  const now = audioCtx?.currentTime ?? 0;
  for (const {osc, gain} of activeNodes) {
    try {
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.12);
      osc.stop(now + 0.13);
    } catch {}
  }
  activeNodes = [];
}

function playNote(midi, duration = 1.5, time = 0, volumeMul = 1.0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  osc.type = 'triangle';
  const hold = Math.max(duration, 1.5);
  const peak = 0.15 * volumeMul;
  const start = audioCtx.currentTime + time;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(peak, start + 0.01);
  gain.gain.setValueAtTime(peak, start + hold - 0.04);
  gain.gain.linearRampToValueAtTime(0, start + hold);
  osc.start(start);
  osc.stop(start + hold + 0.05);
  activeNodes.push({osc, gain});
}

function previewChordByData(c) {
  c.pitches.forEach((pname, i) => {
    let midi = pitchNameToMidi(pname);
    if (!midi) return;
    while (midi < 48) midi += 12;
    while (midi > 72) midi -= 12;
    playNote(midi, 1.8, i * 0.02);
  });
}

function formatPitch(name) {
  return name.replace(/([A-G])-(\d)/, '$1♭$2').replace(/([A-G])#(\d)/, '$1♯$2');
}

function pitchNameToMidi(name) {
  const match = name.match(/^([A-G][#b\-]{0,2})(-?\d+)$/);
  if (!match) return null;
  const noteMap = {
    C:0, 'C#':1, 'C-':11, Db:1,
    D:2, 'D#':3, 'D-':1,  Eb:3, 'E-':3,
    E:4, 'E#':5,
    F:5, 'F#':6, 'F-':4,  Gb:6,
    G:7, 'G#':8, 'G-':6,  Ab:8, 'A-':8,
    A:9, 'A#':10,'A-':8,  Bb:10,'B-':10,
    B:11,'B#':0,
  };
  return (parseInt(match[2]) + 1) * 12 + (noteMap[match[1]] ?? 0);
}

// --- Playback ---
function stopPlayback() {
  isPlaying = false;
  clearTimeout(loopTimeout);
  stopPreview();
  document.getElementById('play-btn').textContent = '▶ Play';
}

function togglePlay() {
  if (isPlaying) { stopPlayback(); return; }
  startPlayback();
}

function toggleLoop() {
  isLooping = !isLooping;
  const btn = document.getElementById('loop-btn');
  btn.style.color = isLooping ? 'var(--accent)' : '';
  btn.style.borderColor = isLooping ? 'var(--accent)' : '';
}

async function startPlayback() {
  if (progression.length === 0) return;
  isPlaying = true;
  document.getElementById('play-btn').textContent = '■ Stop';
  await playProgression();
}

async function playProgression() {
  if (!isPlaying) return;
  const tempo = parseInt(document.getElementById('tempo').value);
  const beatsPerSec = tempo / 60;
  let time = 0;
  try {
    const voiced = await fetchVoiceLeading();
    for (const row of voiced.table) {
      const dur = row.duration / beatsPerSec;
      row.voices.forEach((v, vi) => {
        const midi = pitchNameToMidi(v.pitch);
        if (midi) playNote(midi, dur * 0.92, time, voiceVolumes[vi] / 100);
      });
      time += dur;
    }
  } catch { time = 2; } // on error, wait 2s and retry
  if (isPlaying) {
    loopTimeout = setTimeout(() => {
      if (isLooping || time > 0) playProgression();
      else { isPlaying = false; document.getElementById('play-btn').textContent = '▶ Play'; }
    }, time * 1000);
  }
}

// --- Picker ---
function makeChordBtn(c) {
  const btn = document.createElement('button');
  btn.className = 'chord-btn';
  btn.innerHTML = c.numeral;
  btn.addEventListener('mouseenter', () => {
    setStatus(`${c.numeral} — ${c.name} (${c.pitches.map(formatPitch).join(', ')}) · click to add`);
    if (isPlaying) return;
    clearTimeout(previewTimeout);
    previewTimeout = setTimeout(() => previewChordByData(c), 80);
  });
  btn.addEventListener('mouseleave', () => {
    clearTimeout(previewTimeout);
    if (!isPlaying) stopPreview();
    setStatus('hover a chord to preview · click to add');
  });
  btn.addEventListener('click', () => addChord(c.numeral, c.duration_default, c.fn));
  return btn;
}

function renderPicker() {
  const container = document.getElementById('chord-picker');
  container.innerHTML = '';

  // Group all chords by fn_role → tonic/predominant/dominant
  const groups = { tonic: [], predominant: [], dominant: [] };
  for (const chords of Object.values(chordData)) {
    for (const c of chords) {
      const role = c.fn_role || c.fn;
      if (!groups[role]) continue;
      if (activeCategories.has(chordCategory(c))) groups[role].push(c);
    }
  }

  for (const [role, chords] of Object.entries(groups)) {
    if (!chords.length) continue;
    const group = document.createElement('div');
    group.className = 'fn-group';
    group.innerHTML = `<div class="fn-label">${FN_LABELS[role]}</div>`;
    // Split into diatonic / non-diatonic with a divider if both present
    const diatonic = chords.filter(c => chordCategory(c) === 'diatonic');
    const other    = chords.filter(c => chordCategory(c) !== 'diatonic');
    const addGrid = cs => {
      const g = document.createElement('div');
      g.className = 'fn-buttons';
      cs.forEach(c => g.appendChild(makeChordBtn(c)));
      group.appendChild(g);
    };
    if (diatonic.length) addGrid(diatonic);
    if (diatonic.length && other.length) group.appendChild(Object.assign(document.createElement('hr'), {className: 'fn-divider'}));
    if (other.length) addGrid(other);
    container.appendChild(group);
  }
}

async function addCustomChord() {
  const input = document.getElementById('custom-numeral');
  const numeral = input.value.trim();
  if (!numeral) return;
  const key = document.getElementById('key-select').value;
  const mode = document.getElementById('mode-select').value;
  const res = await fetch('/parse-chord', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ numeral, key, mode }),
  });
  const data = await res.json();
  if (data.error) { setStatus(`Error: ${data.error}`); return; }
  previewChordByData(data);
  addChord(data.numeral, data.duration_default, null);
  input.value = '';
}

document.getElementById('custom-numeral')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') addCustomChord();
});

// --- Progression ---
function addChord(numeral, duration = 4.0, fn = null) {
  const last = progression[progression.length - 1];
  if (last && last.numeral === numeral) {
    last.duration *= 2;
  } else {
    progression.push({ numeral, duration, fn, inversion: 0 });
  }
  renderProgression();
  renderPicker();
  updateVoiceTable();
  saveState();
}

function isSeventhChord(numeral) {
  return /7|maj7|ø7|o7/.test(numeral);
}

function removeChord(i) {
  progression.splice(i, 1);
  renderProgression();
  renderPicker();
  updateVoiceTable();
  saveState();
}

function clearProgression() {
  progression = [];
  renderProgression();
  renderPicker();
  updateVoiceTable();
  saveState();
}

let dragSrcIndex = null;

function getTimeSig() {
  return 4; // beats per bar — could wire to time sig selector later
}

function renderProgression() {
  const list = document.getElementById('chord-list');
  list.innerHTML = '';
  let beatCursor = 0;
  progression.forEach((c, i) => {
    const bar = Math.floor(beatCursor / getTimeSig()) + 1;
    const beat = (beatCursor % getTimeSig()) + 1;
    const barLabel = beat === 1 ? `m.${bar}` : `m.${bar}.${beat}`;
    beatCursor += c.duration;
    const item = document.createElement('div');
    item.className = 'chord-item';
    item.draggable = true;
    item.addEventListener('dragstart', e => {
      dragSrcIndex = i;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.chord-item').forEach(el => el.classList.remove('drag-over'));
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      if (dragSrcIndex === null || dragSrcIndex === i) return;
      const moved = progression.splice(dragSrcIndex, 1)[0];
      progression.splice(i, 0, moved);
      dragSrcIndex = null;
      renderProgression();
      updateVoiceTable();
      saveState();
    });
    const invOptions = isSeventhChord(c.numeral) ? ['R','1st','2nd','3rd','auto'] : ['R','1st','2nd','auto'];
    const invValues  = isSeventhChord(c.numeral) ? [0,1,2,3,-1] : [0,1,2,-1];
    const invHtml = invOptions.map((l, idx) => {
      const v = invValues[idx];
      return `<option value="${v}" ${c.inversion === v ? 'selected' : ''}>${l}</option>`;
    }).join('');
    item.innerHTML = `
      <span class="bar-num">${barLabel}</span>
      <span class="numeral">${c.numeral}</span>
      <input class="dur-input" type="number" value="${c.duration}" min="0.5" max="64" step="0.5">
      <span class="beats-label">♩</span>
      <select class="inv-select">${invHtml}</select>
      <button class="remove-btn" title="remove">×</button>
    `;
    const durEl = item.querySelector('.dur-input');
    durEl.addEventListener('change', e => {
      progression[i].duration = parseFloat(e.target.value);
      updateVoiceTable(); saveState();
    });
    addWheelNumber(durEl, 0.5, 0.5, 64, el => {
      progression[i].duration = parseFloat(el.value);
      updateVoiceTable(); saveState();
    });

    const invSel = item.querySelector('.inv-select');
    invSel.addEventListener('change', e => {
      progression[i].inversion = parseInt(e.target.value);
      updateVoiceTable(); saveState();
    });
    addWheelSelect(invSel, el => {
      progression[i].inversion = parseInt(el.value);
      updateVoiceTable(); saveState();
    });
    item.querySelector('.remove-btn').addEventListener('click', () => removeChord(i));
    list.appendChild(item);
  });
}

// --- Voice table ---
async function fetchVoiceLeading() {
  const key = document.getElementById('key-select').value;
  const mode = document.getElementById('mode-select').value;
  const tempo = parseInt(document.getElementById('tempo').value);
  const res = await fetch('/voice-lead', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      key, mode, tempo, time_sig: [4,4], n_voices: 4,
      voicing_style: document.getElementById('voicing-select').value,
      voice_volumes: voiceVolumes,
      chords: progression.map(c => ({numeral: c.numeral, duration: c.duration, inversion: c.inversion ?? 0})),
    }),
  });
  return res.json();
}

function detectParallels(table) {
  const warned = new Set();
  for (let i = 1; i < table.length; i++) {
    const prev = table[i-1].voices, curr = table[i].voices;
    const pm = prev.map(v => pitchNameToMidi(v.pitch));
    const cm = curr.map(v => pitchNameToMidi(v.pitch));
    for (let a = 0; a < prev.length; a++) {
      for (let b = a+1; b < prev.length; b++) {
        if (!pm[a]||!pm[b]||!cm[a]||!cm[b]) continue;
        const pi = Math.abs(pm[a]-pm[b]) % 12, ci = Math.abs(cm[a]-cm[b]) % 12;
        if (pi === ci && (ci === 7 || ci === 0) && curr[a].delta !== 0 && curr[b].delta !== 0 && curr[a].delta !== null) {
          warned.add(`${i}:${a}`); warned.add(`${i}:${b}`);
        }
      }
    }
  }
  return warned;
}

async function updateVoiceTable() {
  const head = document.getElementById('vt-head');
  const body = document.getElementById('vt-body');
  if (progression.length === 0) {
    head.innerHTML = '';
    body.innerHTML = `<tr><td colspan="6" style="color:var(--text3);padding:12px">add chords to see voice leading</td></tr>`;
    return;
  }
  const data = await fetchVoiceLeading();
  const nv = data.table[0]?.voices.length || 4;
  const parallels = detectParallels(data.table);
  head.innerHTML = '<th>Chord</th><th>Dur</th>' + Array.from({length:nv},(_,i)=>`<th>V${i+1}</th>`).join('');
  body.innerHTML = data.table.map((row, ri) => {
    const cells = row.voices.map((v, vi) => {
      const d = v.delta;
      let cls = d === null ? '' : d > 0 ? 'delta-pos' : d < 0 ? 'delta-neg' : 'delta-zero';
      if (parallels.has(`${ri}:${vi}`)) cls += ' parallel-warn';
      const dstr = d === null ? '' : d === 0 ? ' (—)' : ` (${d>0?'+':''}${d})`;
      return `<td class="${cls}">${formatPitch(v.pitch)}${dstr}</td>`;
    }).join('');
    return `<tr><td>${row.numeral}</td><td style="color:var(--text3)">${row.duration}♩</td>${cells}</tr>`;
  }).join('');
}

// --- Export ---
async function exportMidi() {
  if (progression.length === 0) return;
  const key = document.getElementById('key-select').value;
  const mode = document.getElementById('mode-select').value;
  const tempo = parseInt(document.getElementById('tempo').value);
  const res = await fetch('/export/midi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      key, mode, tempo, time_sig: [4,4], n_voices: 4,
      voicing_style: document.getElementById('voicing-select').value,
      voice_volumes: voiceVolumes,
      chords: progression.map(c => ({numeral: c.numeral, duration: c.duration, inversion: c.inversion ?? 0})),
    }),
  });
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'harmonysplorer.mid';
  a.click();
}

function exportProject() {
  const state = {
    progression, voiceVolumes,
    key: document.getElementById('key-select').value,
    mode: document.getElementById('mode-select').value,
    tempo: document.getElementById('tempo').value,
    voicing: document.getElementById('voicing-select').value,
  };
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `harmonysplorer_${state.key}${state.mode}_${Date.now()}.json`;
  a.click();
}

function importProject(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const s = JSON.parse(ev.target.result);
      if (s.key) document.getElementById('key-select').value = s.key;
      if (s.mode) document.getElementById('mode-select').value = s.mode;
      if (s.tempo) document.getElementById('tempo').value = s.tempo;
      if (s.voicing) document.getElementById('voicing-select').value = s.voicing;
      if (Array.isArray(s.progression)) progression = s.progression;
      if (Array.isArray(s.voiceVolumes)) voiceVolumes = s.voiceVolumes;
      saveState();
      renderMixer();
      loadChords();
      renderProgression();
      updateVoiceTable();
      setStatus(`Loaded ${file.name}`);
    } catch { setStatus('Import failed — invalid JSON'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

init();
</script>
